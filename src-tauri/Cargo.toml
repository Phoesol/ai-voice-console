# AI Voice Console — 主界面 EXE
# After build: copy target\release\ai-voice-console.exe ..\ai-voice-console.exe
[package]
name = "ai-voice-console"
version = "2.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
base64 = "0.22"
regex = "1"
cpal = "0.15"
log = "0.4"
fern = { version = "0.7", features = ["colored"] }
chrono = "0.4"
tauri-plugin-dialog = "2"
dunce = "1"
once_cell = "1"
parking_lot = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation", "Win32_System_Com_StructuredStorage", "Win32_Devices_Properties", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
